<!doctype html>
<html lang="pt-BR" data-tema="grafite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Celular: tela de toque pequena (ou ?celular no endereço) muda o layout (ui/celular.ts, estilo.css). -->
    <script>
      if (/[?&]celular(=|&|$)/.test(location.search) || (matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) <= 820))
        document.documentElement.classList.add("celular");
      // Pela Wi-Fi (http, sem "s") o navegador não tem crypto.randomUUID: o programa usa em todo lugar.
      if (!crypto.randomUUID)
        crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c2128" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HAXYS CAD" />
    <link rel="apple-touch-icon" href="/icone.png" />
    <title>HAXYS CAD</title>
    <link rel="icon" type="image/png" href="/icone.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/abertura.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
