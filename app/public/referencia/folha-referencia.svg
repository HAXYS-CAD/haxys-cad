<text x="130" y="74" font-size="3.4">Esta linha deve medir exatamente 100 mm</text>
<text x="130" y="98" font-size="3.4">Como usar (resumo):</text>
<text x="130" y="104" font-size="3.2">1. Recorte um marcador e ponha ao lado da peça, no mesmo plano dela.</text>
<text x="130" y="109" font-size="3.2">2. Foto de cima, com o celular paralelo à mesa, sem sombra forte.</text>
<text x="130" y="114" font-size="3.2">3. Fundo liso e claro; a peça inteira e o marcador na foto.</text>
<text x="130" y="119" font-size="3.2">4. No HAXYS CAD: Peça a partir de imagem > Escala: pelo marcador.</text>
<text x="130" y="124" font-size="3.2">   Ou mande a foto para a IA no painel Falar com a IA.</text>
